name: Trivy Scan
description: Run Trivy vulnerability scan in both table (console) and JSON (artifact) formats

inputs:
  scan-type:
    description: "Trivy scan type: 'fs' for filesystem, 'image' for container image"
    required: true
  scan-ref:
    description: "Reference to scan — directory path for fs, image tag for image"
    required: true
  artifact-name:
    description: "Name for the uploaded artifact"
    required: true
  json-output:
    description: "Filename for the JSON results"
    required: true
  severity:
    description: "Comma-separated severity levels to report"
    required: false
    default: "CRITICAL,HIGH"

runs:
  using: composite
  steps:
    - name: "Trivy ${{ inputs.scan-type }} scan (console)"
      uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
      with:
        scan-type: ${{ inputs.scan-type }}
        scan-ref: ${{ inputs.scan-ref }}
        image-ref: ${{ inputs.scan-type == 'image' && inputs.scan-ref || '' }}
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        severity: ${{ inputs.severity }}
      continue-on-error: true

    - name: "Trivy ${{ inputs.scan-type }} scan (JSON)"
      uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
      with:
        scan-type: ${{ inputs.scan-type }}
        scan-ref: ${{ inputs.scan-ref }}
        image-ref: ${{ inputs.scan-type == 'image' && inputs.scan-ref || '' }}
        format: 'json'
        output: ${{ inputs.json-output }}
        ignore-unfixed: true
        severity: ${{ inputs.severity }}

    - name: Write Trivy step summary
      if: always()
      shell: bash
      run: |
        if [ -f "${{ inputs.json-output }}" ]; then
          echo "## 🔍 Trivy ${{ inputs.scan-type }} Scan Results" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          jq '[.Results[]? | {Target, Vulns: (.Vulnerabilities // [] | length)}] | sort_by(-.Vulns)' "${{ inputs.json-output }}" >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No parsable results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: "Upload ${{ inputs.artifact-name }}"
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.json-output }}
        retention-days: 7
