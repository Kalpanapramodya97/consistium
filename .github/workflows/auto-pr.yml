name: Auto-Create Pull Request

on:
  push:
    branches-ignore:
      - main
      - master

jobs:
  auto-pr:
    name: Open PR to main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pull Request (if not already open)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          BASE="master"   # change to "main" if your default branch is main

          # Check if a PR already exists for this branch
          EXISTING=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "✅ PR #$EXISTING already exists for branch '$BRANCH' → skipping creation."
            exit 0
          fi

          # Build a clean title from branch name
          # e.g. "feat/add-logging" → "feat: add logging"
          TITLE=$(echo "$BRANCH" \
            | sed 's|.*/||'          \
            | sed 's/[-_]/ /g'       \
            | sed 's/\b\(feat\|fix\|chore\|docs\|ci\|refactor\|test\)\b/\1:/g')

          gh pr create \
            --head "$BRANCH" \
            --base "$BASE" \
            --title "$TITLE" \
            --body "$(cat <<'EOF'
## Summary
<!-- Describe what this PR does -->

## Changes
<!-- List the main changes -->

## Checklist
- [ ] Code quality checks pass
- [ ] Unit tests pass
- [ ] Security scans reviewed
- [ ] No secrets committed

---
*This PR was auto-created by the [Auto-PR workflow](/.github/workflows/auto-pr.yml) on push to `${{ github.ref_name }}`.*
EOF
)" \
            --label "auto-pr" \
            --assignee "${{ github.actor }}"

          echo "🚀 Pull request created: $BRANCH → $BASE"
