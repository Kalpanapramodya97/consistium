name: Stale Issues & PRs

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Close Stale Issues & PRs
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale items
        uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            any activity for 30 days. It will be closed in 7 days if no further
            activity occurs. Remove the `stale` label to keep it open.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has
            not had any activity for 30 days. It will be closed in 7 days if no
            further activity occurs. Remove the `stale` label to keep it open.
          close-issue-message: >
            This issue was closed because it has been stale for 7 days with no
            activity. Feel free to reopen if this is still relevant.
          close-pr-message: >
            This pull request was closed because it has been stale for 7 days with
            no activity. Feel free to reopen if this is still needed.
          exempt-issue-labels: pinned,security,bug
          exempt-pr-labels: pinned,security
