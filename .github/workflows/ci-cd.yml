name: CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

# ── Least-privilege: drop all permissions by default ──────────
# Each job declares only the permissions it needs.
permissions: {}

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  NODE_VERSION: '20'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # PHASE 1: Source Code Checks (Parallel)
  # ==========================================
  commitlint:
    name: Commit Message Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Commitlint
        run: npx commitlint --from ${{ github.event.pull_request.base.sha || github.event.before }} --to ${{ github.event.pull_request.head.sha || github.sha }} --verbose

  backup-test:
    name: Verify Backup/Restore Scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start Database
        run: docker compose up -d --wait mongodb
      - name: Seed Database
        run: |
          docker compose exec -T mongodb mongosh consistium --eval 'db.habits.insertOne({name: "CI/CD Test Habit"})'
      - name: Run Backup
        run: make backup
      - name: Verify Backup
        run: make verify-backup

  quality-checks:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Ensure .env is not tracked by git
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::The .env file is tracked by git! Remove it with 'git rm --cached .env' and add to .gitignore."
            exit 1
          fi
          echo "✅ .env is not tracked"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint HTML
        run: npx htmlhint "**/*.html"

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Tests with Coverage
        working-directory: ./backend
        run: npm test -- --coverage 2>/dev/null || npm test

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 7
        continue-on-error: true

  terraform-checks:
    name: Terraform Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.5.0

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Init (No Backend)
        working-directory: ./terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.50.3
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Init TFLint
        working-directory: ./terraform
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        working-directory: ./terraform
        run: tflint -f compact

  helm-chart-test:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.15.2

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.6/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin
          kubeconform -v

      - name: Helm Lint — All Environments
        run: |
          # Lint default values
          helm lint ./helm/consistium --strict
          echo "✅ Default lint passed"

          # Lint each environment overlay
          for env in dev staging prod; do
            helm lint ./helm/consistium -f helm/environments/${env}.yaml --strict
            echo "✅ ${env} lint passed"
          done

      - name: Helm Template & Kubeconform — All Environments
        run: |
          KUBECONFORM_OPTS="-summary -strict -kubernetes-version 1.30.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas"

          # Default values
          mkdir -p rendered-manifests/default
          helm template consistium ./helm/consistium > rendered-manifests/default/manifests.yaml
          eval kubeconform ${KUBECONFORM_OPTS} rendered-manifests/default/manifests.yaml
          echo "✅ Default template rendered and validated"

          # Environment overlays
          for env in dev staging prod; do
            mkdir -p rendered-manifests/${env}
            helm template consistium ./helm/consistium -f helm/environments/${env}.yaml > rendered-manifests/${env}/manifests.yaml
            eval kubeconform ${KUBECONFORM_OPTS} rendered-manifests/${env}/manifests.yaml
            echo "✅ ${env} template rendered and validated"
          done

      - name: Setup chart-testing (ct)
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing lint
        run: ct lint --config .github/ct.yaml --charts helm/consistium

      - name: Upload Rendered Manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helm-rendered-manifests
          path: rendered-manifests/
          retention-days: 7

  infracost-estimation:
    name: Infracost FinOps Estimation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Infracost
        uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3.0.1
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Run Infracost Breakdown
        run: infracost breakdown --path ./terraform --format json --out-file infracost-results.json

      - name: Upload Infracost results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infracost-results
          path: infracost-results.json
          retention-days: 7

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Fetch all history for secret scanning

      - name: TruffleHog Secret Scan
        run: |
          docker run --rm -v "$PWD:/workspace" ghcr.io/trufflesecurity/trufflehog:latest \
            filesystem /workspace \
            --only-verified \
            --json \
            --exclude-paths=/workspace/.trufflehog-exclude \
            > trufflehog-results.json 2>/dev/null || true

          # Ensure valid JSON output even if no results
          if [ ! -s trufflehog-results.json ]; then
            echo "[]" > trufflehog-results.json
          fi

          # Fail the job if verified secrets were found
          SECRETS_COUNT=$(wc -l < trufflehog-results.json)
          if [ "$SECRETS_COUNT" -gt 1 ] || ([ "$SECRETS_COUNT" -eq 1 ] && [ "$(cat trufflehog-results.json)" != "[]" ]); then
            echo "::error::TruffleHog found verified secrets! Review trufflehog-results.json"
            cat trufflehog-results.json | head -20
            exit 1
          fi
          echo "✅ No verified secrets found"

      - name: Upload TruffleHog results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trufflehog-results
          path: trufflehog-results.json
          retention-days: 7

  codeql-sast:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: javascript # For app.js and HTML

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          output: codeql-results

      - name: Upload CodeQL SARIF results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-results
          path: codeql-results/*.sarif
          retention-days: 7

  # ==========================================
  # PHASE 2: Build & Scan (Depends on Phase 1)
  # ==========================================
  dast-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-tests]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start Application Stack
        uses: ./.github/actions/start-app-stack

      - name: Fix workspace permissions for ZAP
        run: chmod -R 777 .

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@a418de766254e096fa7d9e30f8dc9662b58df224 # v0.9.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
          cmd_options: '-a'

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-dast-report
          path: report_html.html
          retention-days: 7

  k6-load-test:
    name: k6 Performance & Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-tests]
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start Application Stack
        uses: ./.github/actions/start-app-stack

      - name: Run k6 Load Test
        run: docker run --rm --network host --user $(id -u):$(id -g) -v ${{ github.workspace }}:/workspace -w /workspace grafana/k6:latest run --out json=k6-results.json tests/k6/load-test.js

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k6-results
          path: k6-results.json
          retention-days: 7

  trivy-fs-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Trivy filesystem scan (console)
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Run Trivy filesystem scan (JSON for report)
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-fs-results.json'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Write Trivy step summary
        if: always()
        run: |
          if [ -f "trivy-fs-results.json" ]; then
            echo "## 🔍 Trivy Filesystem Scan Results" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            jq '[.Results[]? | {Target, Vulns: (.Vulnerabilities // [] | length)}] | sort_by(-.Vulns)' trivy-fs-results.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No parsable results" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Trivy FS results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-fs-results
          path: trivy-fs-results.json
          retention-days: 7
          retention-days: 7

  docker-build-scan-push:
    name: Build, Scan & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Loosened: only gates on quality, tests, and security scans.
    # Infracost, helm-chart-test, and backup-test run in parallel but don't block the build.
    needs: [commitlint, quality-checks, backend-tests, secret-scan, codeql-sast, trivy-fs-scan, dast-scan, k6-load-test]
    permissions:
      contents: read
      packages: write
      id-token: write   # Required for Cosign keyless signing via Sigstore OIDC
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Extract repository name in lowercase
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ghcr.io/${{ env.REPO }}/habit-tracker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build Docker image (Load to Docker daemon for scanning)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ./Dockerfile
          pull: true # Ensure fresh base image layers are pulled from registry
          load: true # Load image into Docker daemon so Trivy can scan it
          tags: habit-tracker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy image scan (console)
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          image-ref: 'habit-tracker:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy image scan (JSON for report)
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          image-ref: 'habit-tracker:${{ github.sha }}'
          format: 'json'
          output: 'trivy-image-results.json'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy image results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-image-results
          path: trivy-image-results.json
          retention-days: 7

      # ── SBOM: Generate Software Bill of Materials from Docker image ─────────
      - name: Install Syft (SBOM Generator)
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.4.1

      - name: Generate SBOM — CycloneDX JSON (Docker image)
        run: syft habit-tracker:${{ github.sha }} -o cyclonedx-json=sbom-image-cyclonedx.json

      - name: Generate SBOM — SPDX JSON (Docker image)
        run: syft habit-tracker:${{ github.sha }} -o spdx-json=sbom-image-spdx.json

      - name: Upload Docker Image SBOM artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-docker-image
          path: |
            sbom-image-cyclonedx.json
            sbom-image-spdx.json
          retention-days: 90

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        id: push
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max    # SLSA provenance attestation (BuildKit)
          sbom: true              # Attach inline SBOM attestation

      # ── Cosign: Sign the pushed image with keyless OIDC ─────────────────
      - name: Sign Docker image with Cosign (keyless)
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "── Signing image by digest: ${DIGEST} ──"
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
          echo "✅ Image signed successfully with keyless OIDC"

      # ── Cosign: Attach SBOM attestation to image ────────────────────────
      - name: Attest SBOM to Docker image (Cosign)
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "── Attaching CycloneDX SBOM attestation ──"
          cosign attest --yes \
            --predicate sbom-image-cyclonedx.json \
            --type cyclonedx \
            "ghcr.io/${{ env.REPO }}/habit-tracker@${DIGEST}"
          echo "✅ SBOM attestation attached"

      # ── Cosign: Verify signature (smoke test) ───────────────────────────
      - name: Verify Docker image signature (smoke test)
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "── Verifying Cosign signature ──"
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "ghcr.io/${{ env.REPO }}/habit-tracker@${DIGEST}"
          echo "✅ Signature verified — image is authentic"

  # ── SBOM: Filesystem & npm Dependency Scan (runs in parallel) ───────────────
  sbom-filesystem:
    name: SBOM - Filesystem & Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Backend Dependencies (for accurate npm SBOM)
        working-directory: ./backend
        run: npm ci

      - name: Install Syft (SBOM Generator)
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.4.1

      - name: Generate SBOM — CycloneDX JSON (filesystem)
        run: syft dir:. -o cyclonedx-json=sbom-fs-cyclonedx.json

      - name: Generate SBOM — SPDX JSON (filesystem)
        run: syft dir:. -o spdx-json=sbom-fs-spdx.json

      - name: Upload Filesystem SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-filesystem
          path: |
            sbom-fs-cyclonedx.json
            sbom-fs-spdx.json
          retention-days: 90

  # ==========================================
  # PHASE 3: Release & Reporting (Depends on Phase 2)
  # ==========================================
  # ==========================================
  # ENVIRONMENT GATE — requires a reviewer to
  # approve in GitHub → Settings → Environments
  # → production before this job runs.
  # No cloud infra needed: this gate controls
  # the GitHub Release creation only.
  # ==========================================
  semantic-versioning:
    name: Generate Semantic Version & Release
    runs-on: ubuntu-latest
    needs: [docker-build-scan-push, sbom-filesystem]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases
    permissions:
      contents: write
      id-token: write   # Required for Cosign verification
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ── Signature Verification Gate ─────────────────────────────────────
      # Ensures only signed images get released. If verification fails,
      # the release is blocked.
      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Extract repository name in lowercase
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Verify image signature before release
        run: |
          echo "── Verification gate: ensuring image is signed ──"
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "ghcr.io/${{ env.REPO }}/habit-tracker:latest"
          echo "✅ Image signature verified — proceeding with release"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: habit-tracker-assets
          path: |
            index.html
            style.css
            app.js
          retention-days: 7

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: "main,master"

      - name: Generate Release Document
        env:
          CHANGELOG: ${{ steps.tag_version.outputs.changelog }}
          VERSION: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          # Markdown version for GitHub Release
          echo "# Release Document - $VERSION" > RELEASE_DOCUMENT.md
          echo "Date: $(date +'%Y-%m-%d')" >> RELEASE_DOCUMENT.md
          echo "" >> RELEASE_DOCUMENT.md
          echo "## Changes" >> RELEASE_DOCUMENT.md
          echo "$CHANGELOG" >> RELEASE_DOCUMENT.md
          echo "" >> RELEASE_DOCUMENT.md
          echo "**Commit:** ${{ github.sha }}" >> RELEASE_DOCUMENT.md
          
          # Colorful HTML version for Email
          cat <<EOF > RELEASE_DOCUMENT.html
          <!DOCTYPE html>
          <html>
          <head>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
            .container { max-width: 800px; margin: auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-top: 5px solid #e74c3c; }
            h1 { color: #2c3e50; }
            .version { background: #e74c3c; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.8em; vertical-align: middle; }
            .meta { color: #7f8c8d; font-size: 0.9em; margin-bottom: 20px; }
            .changes { background: #2c3e50; color: #ecf0f1; padding: 20px; border-radius: 8px; margin-top: 20px; white-space: pre-wrap; font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; line-height: 1.5; }
            .footer { margin-top: 30px; text-align: center; color: #95a5a6; font-size: 0.8em; border-top: 1px solid #eee; padding-top: 20px; }
          </style>
          </head>
          <body>
          <div class="container">
            <h1>🚀 Consistium Release <span class="version">$VERSION</span></h1>
            <div class="meta">
              <strong>Date:</strong> $(date +'%Y-%m-%d')<br>
              <strong>Commit:</strong> <code>${{ github.sha }}</code>
            </div>
            <h2>✨ What's New</h2>
            <div class="changes">${CHANGELOG}</div>
            <div class="footer">Consistium CI/CD Pipeline &bull; 1% better every day</div>
          </div>
          </body>
          </html>
          EOF

      - name: Upload Release Document Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-document-${{ steps.tag_version.outputs.new_tag }}
          path: |
            RELEASE_DOCUMENT.md
            RELEASE_DOCUMENT.html
          retention-days: 90

      - name: Download Docker Image SBOM for Release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom-docker-image
          path: sbom-release/
        continue-on-error: true

      - name: Download Filesystem SBOM for Release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom-filesystem
          path: sbom-release/
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body_path: RELEASE_DOCUMENT.md
          files: |
            RELEASE_DOCUMENT.md
            sbom-release/sbom-image-cyclonedx.json
            sbom-release/sbom-image-spdx.json
            sbom-release/sbom-fs-cyclonedx.json
            sbom-release/sbom-fs-spdx.json

      - name: Send Release Document via Email
        uses: dawidd6/action-send-mail@48476814b0338573004e9de1e8504b25ff8cc23c # v3.9.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚀 Consistium New Release: ${{ steps.tag_version.outputs.new_tag }}"
          to: kalpanapramodya97@gmail.com
          from: Consistium Release <kalpanapramodya97@gmail.com>
          body: |
            A new release (${{ steps.tag_version.outputs.new_tag }}) has been created for Consistium!
            
            The colorful release document detailing all the changes is attached to this email.
            
            🔗 View the release on GitHub:
            ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.tag_version.outputs.new_tag }}
            
            ◆ Consistium — 1% better every day
          attachments: RELEASE_DOCUMENT.html

  security-report:
    name: Generate DevSecOps & FinOps Report
    runs-on: ubuntu-latest
    needs: [commitlint, backup-test, quality-checks, backend-tests, terraform-checks, helm-chart-test, infracost-estimation, secret-scan, codeql-sast, trivy-fs-scan, docker-build-scan-push, dast-scan, k6-load-test, sbom-filesystem]
    if: always() # Generate report even if scans fail — runs on PRs AND master
    # NOTE: No environment gate here — this job runs on every PR run.
    # The environment gate lives only on semantic-versioning (master-only).
    permissions:
      contents: read
      pull-requests: write  # Required for PR summary comment
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download TruffleHog results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: trufflehog-results
          path: scan-results/
        continue-on-error: true

      - name: Download CodeQL results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codeql-results
          path: scan-results/
        continue-on-error: true

      - name: Download Trivy FS results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: trivy-fs-results
          path: scan-results/
        continue-on-error: true

      - name: Download Trivy image results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: trivy-image-results
          path: scan-results/
        continue-on-error: true

      - name: Download Infracost results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: infracost-results
          path: scan-results/
        continue-on-error: true

      - name: Download Docker Image SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom-docker-image
          path: scan-results/sbom/
        continue-on-error: true

      - name: Download Filesystem SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom-filesystem
          path: scan-results/sbom/
        continue-on-error: true

      - name: Install jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq

      - name: Make report generator executable
        run: chmod +x security/generate-report.sh

      - name: Detect CodeQL SARIF file
        id: detect-sarif
        run: |
          SARIF_FILE=$(find scan-results/ -name "*.sarif" -type f | head -1)
          echo "sarif_file=${SARIF_FILE:-}" >> $GITHUB_OUTPUT
          echo "Found SARIF: ${SARIF_FILE:-none}"

      - name: Generate branded security report
        run: |
          bash security/generate-report.sh \
            --trufflehog "scan-results/trufflehog-results.json" \
            --codeql "${{ steps.detect-sarif.outputs.sarif_file }}" \
            --trivy-fs "scan-results/trivy-fs-results.json" \
            --trivy-image "scan-results/trivy-image-results.json" \
            --infracost "scan-results/infracost-results.json" \
            --template "security/report-template.html" \
            --output "consistium-security-report.html"

      - name: Upload security report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consistium-security-report
          path: consistium-security-report.html
          retention-days: 90

      - name: Send security report via email
        uses: dawidd6/action-send-mail@48476814b0338573004e9de1e8504b25ff8cc23c # v3.9.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🛡️ Consistium DevSecOps & FinOps Report — ${{ github.ref_name }} — Run #${{ github.run_number }}"
          to: kalpanapramodya97@gmail.com
          from: Consistium DevSecOps <kalpanapramodya97@gmail.com>
          body: |
            Consistium DevSecOps Pipeline — DevSecOps & FinOps Report

            ────────────────────────────────────────────
            📋 Pipeline Run Details
            ────────────────────────────────────────────
            • Branch:   ${{ github.ref_name }}
            • Commit:   ${{ github.sha }}
            • Trigger:  ${{ github.event_name }}
            • Run:      #${{ github.run_number }}
            • Date:     ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at || 'scheduled' }}

            The full branded security report is attached to this email as an HTML file.
            Open it in any web browser to view the detailed findings.

            🔗 View the full pipeline run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ────────────────────────────────────────────
            This is an automated email from the Consistium DevSecOps Pipeline.
            ◆ Consistium — 1% better every day
          attachments: consistium-security-report.html

      - name: Post pipeline summary to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: pipeline-summary
          message: |
            ## 🛡️ Pipeline Summary — Run #${{ github.run_number }}

            | Check | Status |
            |-------|--------|
            | Commit Lint | `${{ needs.commitlint.result }}` |
            | Backup Test | `${{ needs.backup-test.result }}` |
            | Code Quality | `${{ needs.quality-checks.result }}` |
            | Unit Tests | `${{ needs.backend-tests.result }}` |
            | Terraform | `${{ needs.terraform-checks.result }}` |
            | Helm Charts | `${{ needs.helm-chart-test.result }}` |
            | Infracost | `${{ needs.infracost-estimation.result }}` |
            | Secret Scan | `${{ needs.secret-scan.result }}` |
            | CodeQL SAST | `${{ needs.codeql-sast.result }}` |
            | Trivy FS | `${{ needs.trivy-fs-scan.result }}` |
            | DAST (ZAP) | `${{ needs.dast-scan.result }}` |
            | Load Test (k6) | `${{ needs.k6-load-test.result }}` |
            | Docker Build | `${{ needs.docker-build-scan-push.result }}` |
            | SBOM | `${{ needs.sbom-filesystem.result }}` |

            📄 [View full pipeline run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
