# ──────────────────────────────────────────────────────────────
# Development Environment — Minimal resources, single replica
# Usage: helm install consistium ./helm/consistium -f helm/environments/dev.yaml
# ──────────────────────────────────────────────────────────────

replicaCount: 1

image:
  pullPolicy: Always

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: consistium.dev.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 32Mi
  requests:
    cpu: 25m
    memory: 8Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false

nginx:
  workerProcesses: "1"
  workerConnections: 128
