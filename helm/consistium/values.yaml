# ──────────────────────────────────────────────────────────────
# Consistium Helm Values — Default Configuration
# Override per environment using helm/environments/*.yaml
# ──────────────────────────────────────────────────────────────

# -- Number of replicas
replicaCount: 2

image:
  repository: ghcr.io/kalpanapramodya97/consistium/habit-tracker
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default: Chart appVersion)
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ──────────────────────────────────────────────────────────────
# Service Account
# ──────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# ──────────────────────────────────────────────────────────────
# Pod-level configuration
# ──────────────────────────────────────────────────────────────
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9113"

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101      # nginx user in alpine
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ──────────────────────────────────────────────────────────────
# Service
# ──────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 80
  annotations: {}

# ──────────────────────────────────────────────────────────────
# Ingress
# ──────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: consistium.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: consistium-tls
      hosts:
        - consistium.local

# ──────────────────────────────────────────────────────────────
# Resources
# ──────────────────────────────────────────────────────────────
resources:
  limits:
    cpu: 250m
    memory: 64Mi
  requests:
    cpu: 50m
    memory: 16Mi

# ──────────────────────────────────────────────────────────────
# Probes
# ──────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
  failureThreshold: 10

# ──────────────────────────────────────────────────────────────
# Horizontal Pod Autoscaler
# ──────────────────────────────────────────────────────────────
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

# ──────────────────────────────────────────────────────────────
# Pod Disruption Budget
# ──────────────────────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1  # Alternative to minAvailable

# ──────────────────────────────────────────────────────────────
# Network Policy
# ──────────────────────────────────────────────────────────────
networkPolicy:
  enabled: true
  # Allow ingress from ingress controller and monitoring
  ingress:
    - ports:
        - port: 80
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  # Allow DNS egress only
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# ──────────────────────────────────────────────────────────────
# Service Monitor (Prometheus Operator)
# ──────────────────────────────────────────────────────────────
serviceMonitor:
  enabled: true
  namespace: ""
  interval: 15s
  scrapeTimeout: 10s
  labels: {}
  metricRelabelings: []
  relabelings: []

# ──────────────────────────────────────────────────────────────
# Nginx ConfigMap
# ──────────────────────────────────────────────────────────────
nginx:
  workerProcesses: "auto"
  workerConnections: 1024
  keepaliveTimeout: 65
  gzip: true
  cacheExpiry: "7d"

# ──────────────────────────────────────────────────────────────
# Topology & Scheduling
# ──────────────────────────────────────────────────────────────
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - consistium
          topologyKey: kubernetes.io/hostname

# ──────────────────────────────────────────────────────────────
# Deployment Strategy
# ──────────────────────────────────────────────────────────────
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# ──────────────────────────────────────────────────────────────
# Lifecycle hooks
# ──────────────────────────────────────────────────────────────
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 5 && nginx -s quit"]
