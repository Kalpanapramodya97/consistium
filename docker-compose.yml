services:
  # ── Application Layer ───────────────────────────────────────────────────────
  consistium:
    build: .
    container_name: consistium
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Resource limits for low-spec machines
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 32M
        reservations:
          cpus: '0.05'
          memory: 8M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/consistium
      - JWT_SECRET=super_secret_consistium_key_change_in_prod
      - PORT=5000
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Observability Layer ─────────────────────────────────────────────────────
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: nginx-exporter
    command:
      - -nginx.scrape-uri=http://consistium:80/stub_status
    ports:
      - "9113:9113"
    depends_on:
      consistium:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["monitoring", "full"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9113/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Prometheus: metrics collection + alert rule evaluation ──────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - ./prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml
    ports:
      - "9090:9090"
    depends_on:
      alertmanager:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["monitoring", "full"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'   # POST /-/reload for hot-reload
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Alertmanager: alert routing & email delivery ────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./alertmanager/templates:/etc/alertmanager/templates
    ports:
      - "9093:9093"
    env_file:
      - .env                        # loads SMTP_PASSWORD from .env
    entrypoint:
      - 'sh'
      - '-c'
      - 'sed "s/\$${SMTP_PASSWORD}/$$SMTP_PASSWORD/g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml && /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager --web.external-url=http://localhost:9093'
    restart: unless-stopped
    profiles: ["monitoring", "full"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    profiles: ["monitoring", "full"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    profiles: ["monitoring", "full"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    profiles: ["monitoring", "full"]
    depends_on:
      loki:
        condition: service_healthy

  # ── Automation Layer ────────────────────────────────────────────────────────
  ansible-runner:
    build:
      context: .
      dockerfile: ansible/Dockerfile
    container_name: ansible-runner
    volumes:
      - .:/workspace
      - C:/Users/u/Downloads:/downloads
    # We do not use restart: unless-stopped so it runs once and finishes, rather than looping infinitely.
    restart: "no"

  # ── Backup Service (one-shot) ───────────────────────────────────────────────
  backup:
    image: mongo:6
    container_name: consistium-backup
    volumes:
      - ./backup:/scripts:ro
      - ./backups:/workspace/backups
    entrypoint: ["bash", "/scripts/backup.sh"]
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=consistium
      - BACKUP_DIR=/workspace/backups
      - RETENTION_COUNT=7
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    profiles: ["backup"]

volumes:
  mongodb_data:
