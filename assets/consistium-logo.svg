<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0088cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6c63ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00d4ff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Diamond icon -->
  <g transform="translate(50, 50)" filter="url(#glow)">
    <!-- Outer diamond -->
    <polygon points="0,-30 25,0 0,30 -25,0" fill="url(#diamondGrad)" opacity="0.9"/>
    <!-- Inner diamond highlight -->
    <polygon points="0,-18 15,0 0,18 -15,0" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="3" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- App name -->
  <text x="90" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="url(#textGrad)" letter-spacing="1" filter="url(#shadow)">Consistium</text>

  <!-- Tagline -->
  <text x="90" y="65" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8892b0" letter-spacing="3" text-transform="uppercase">ATOMIC HABIT TRACKER</text>
</svg>
